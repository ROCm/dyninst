name: Build and Install Dyninst

# Runs the build-and-install check across every supported container image.

on:
  pull_request:
    branches: [dyninst_13]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-ubuntu-24.04
          - name: ubuntu-22.04
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-ubuntu-22.04
          - name: debian-12
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-debian-12
          - name: rhel-8.10
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-rhel-8.10
          - name: rhel-9
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-rhel-9
          - name: rhel-10
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-rhel-10
    uses: ./.github/workflows/build.yaml
    with:
      name: ${{ matrix.name }}
      image: ${{ matrix.image }}
